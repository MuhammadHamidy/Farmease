version: '3.9'

# Production Full Ecosystem Configuration (SSO + Ternak + Kebun)
# Includes network aliases for postgres, redis, rabbitmq, and sso

services:
  # ============================================================================
  # 1. DATABASES & MIDDLEWARE (PRODUCTION)
  # ============================================================================
  sso_postgres_prod:
    image: postgres:15-alpine
    container_name: farmease_sso_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
      POSTGRES_DB: farmease_sso_prod
    ports:
      - "5445:5432"
    volumes:
      - sso_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d farmease_sso_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      farmease_prod_network:
        aliases:
          - postgres
          - sso_postgres

  sso_redis_prod:
    image: redis:7-alpine
    container_name: farmease_sso_redis_prod
    ports:
      - "6382:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      farmease_prod_network:
        aliases:
          - redis
          - sso_redis
    restart: always

  peternakan_postgres_prod:
    image: postgres:15-alpine
    container_name: farmease_peternakan_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
      POSTGRES_DB: farmease_peternakan_prod
    ports:
      - "5446:5432"
    volumes:
      - peternakan_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d farmease_peternakan_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      farmease_prod_network:
        aliases:
          - postgres
          - peternakan_postgres

  peternakan_rabbitmq_prod:
    image: rabbitmq:3-management-alpine
    container_name: farmease_peternakan_rabbitmq_prod
    ports:
      - "5673:5672"
      - "15673:15672"
    healthcheck:
      test: ["CMD", "rabbitmqctl", "status"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      farmease_prod_network:
        aliases:
          - rabbitmq
          - peternakan_rabbitmq
    restart: always

  kebun_postgres_prod:
    image: postgres:15-alpine
    container_name: farmease_kebun_postgres_prod
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-pass}
      POSTGRES_DB: farmease_kebun_prod
    ports:
      - "5447:5432"
    volumes:
      - kebun_postgres_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-user} -d farmease_kebun_prod"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      farmease_prod_network:
        aliases:
          - postgres
          - kebun_postgres

  # ============================================================================
  # 2. BACKEND MICROSERVICES (PRODUCTION)
  # ============================================================================
  sso_be_prod:
    build:
      context: ./sso-be
      dockerfile: sso/Dockerfile
    container_name: farmease_sso_be_prod
    restart: always
    depends_on:
      sso_postgres_prod:
        condition: service_healthy
      sso_redis_prod:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_PORT: "8080"
      APP_POSTGRES_URL: postgres://${DB_USER:-user}:${DB_PASSWORD:-pass}@sso_postgres_prod:5432/farmease_sso_prod?sslmode=disable
      APP_REDIS_ADDRESS: sso_redis_prod:6379
      APP_JWTSECRET: ${JWT_SECRET:-farmease-secret-key-123}
      APP_REDIRECTURL: https://sso.farmease.id/callback
    ports:
      - "8084:8080"  # Dedicated Production SSO BE Host Port (8084)
    networks:
      farmease_prod_network:
        aliases:
          - sso
          - sso_be

  peternakan_be_prod:
    build:
      context: ./Farmease-BE
      dockerfile: farmease/Dockerfile
    container_name: farmease_peternakan_be_prod
    restart: always
    depends_on:
      peternakan_postgres_prod:
        condition: service_healthy
      peternakan_rabbitmq_prod:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_PORT: "8081"
      APP_POSTGRES_URL: postgres://${DB_USER:-user}:${DB_PASSWORD:-pass}@peternakan_postgres_prod:5432/farmease_peternakan_prod?sslmode=disable
      APP_SSOAPIURL: http://sso_be_prod:8080
      APP_RABBITMQ_URL: amqp://guest:guest@peternakan_rabbitmq_prod:5672/
    ports:
      - "8081:8081"  # Dedicated Production Ternak BE Host Port (8081)
    networks:
      farmease_prod_network:
        aliases:
          - peternakan_be
          - farmease_be

  kebun_be_prod:
    build:
      context: ./kebun-be
      dockerfile: kebun/Dockerfile
    container_name: farmease_kebun_be_prod
    restart: always
    depends_on:
      kebun_postgres_prod:
        condition: service_healthy
    environment:
      APP_ENV: production
      APP_PORT: "8082"
      APP_POSTGRES_URL: postgres://${DB_USER:-user}:${DB_PASSWORD:-pass}@kebun_postgres_prod:5432/farmease_kebun_prod?sslmode=disable
      APP_SSOAPIURL: http://sso_be_prod:8080
    ports:
      - "8082:8082"  # Dedicated Production Kebun BE Host Port (8082)
    networks:
      farmease_prod_network:
        aliases:
          - kebun_be

  # ============================================================================
  # 3. FRONTEND APPS (PRODUCTION)
  # ============================================================================
  sso_fe_prod:
    build:
      context: ./Farmease_sso
      dockerfile: Dockerfile
    container_name: farmease_sso_fe_prod
    restart: always
    environment:
      VITE_API_BASE_URL: https://api-sso.netrash.id
    ports:
      - "3000:3000"  # Container listens on 3000
    networks:
      - farmease_prod_network

  ternak_fe_prod:
    build:
      context: ./Farmease
      dockerfile: Dockerfile
    container_name: farmease_ternak_fe_prod
    restart: always
    environment:
      VITE_API_BASE_URL: https://api-ternak.netrash.id
    ports:
      - "3001:3001"  # Container listens on 3001
    networks:
      - farmease_prod_network

  kebun_fe_prod:
    build:
      context: ./Farmease_kebun
      dockerfile: Dockerfile
    container_name: farmease_kebun_fe_prod
    restart: always
    environment:
      VITE_API_BASE_URL: https://api-kebun.netrash.id
    ports:
      - "3002:3002"  # Container listens on 3002
    networks:
      - farmease_prod_network

volumes:
  sso_postgres_prod_data:
    driver: local
  peternakan_postgres_prod_data:
    driver: local
  kebun_postgres_prod_data:
    driver: local

networks:
  farmease_prod_network:
    driver: bridge
