basePath: /
definitions:
  domain.Cage:
    properties:
      cage_code:
        type: string
      cage_name:
        type: string
      cage_type:
        type: string
      capacity:
        type: integer
      created_at:
        type: string
      farm_id:
        type: string
      id_cage:
        type: string
      occupancy:
        type: integer
      updated_at:
        type: string
    type: object
  domain.CageFeedRecommendation:
    properties:
      id_kandang:
        type: string
      jumlah_domba:
        type: integer
      total_hijauan_kg:
        type: number
      total_konsentrat_kg:
        type: number
    type: object
  domain.CageStats:
    properties:
      attention_needed:
        type: integer
      healthy:
        type: integer
      total_animals:
        type: integer
    type: object
  domain.CageWeightStats:
    properties:
      current_average:
        type: number
      growth_kg:
        type: number
      growth_percentage:
        type: number
      monthly_trend:
        items:
          $ref: '#/definitions/domain.MonthlyWeight'
        type: array
    type: object
  domain.Farm:
    properties:
      code:
        type: string
      createdAt:
        type: string
      createdBy:
        type: string
      deletedAt:
        type: string
      deletedBy:
        type: string
      description:
        type: string
      id:
        type: string
      location:
        type: string
      name:
        type: string
      updatedAt:
        type: string
      updatedBy:
        type: string
    type: object
  domain.Feed:
    properties:
      available_stock:
        type: number
      category:
        type: string
      created_at:
        type: string
      external_source_id:
        type: string
      feed_name:
        type: string
      id_feed:
        type: string
      notes:
        type: string
      price_per_unit:
        type: number
      source_api_url:
        type: string
      source_type:
        type: string
      unit:
        type: string
      updated_at:
        type: string
    type: object
  domain.FeedRecommendation:
    properties:
      id_sheep:
        type: string
      rekomendasi_harian:
        items:
          $ref: '#/definitions/domain.RecommendationItem'
        type: array
      sheep_name:
        type: string
      status:
        type: string
      total_pakan_harian_kg:
        type: number
      weight_kg:
        type: number
    type: object
  domain.Feeding:
    properties:
      amount:
        type: number
      created_at:
        type: string
      feed_name:
        type: string
      feeding_date:
        type: string
      id_feed:
        type: string
      id_feeding:
        type: string
      id_sheep:
        type: string
      notes:
        type: string
      unit:
        type: string
    type: object
  domain.FeedingMixture:
    properties:
      created_at:
        type: string
      details:
        items:
          $ref: '#/definitions/domain.FeedingMixtureDetail'
        type: array
      feeding_date:
        type: string
      id_feeding_mixture:
        type: string
      id_sheep:
        type: string
      notes:
        type: string
      total_amount:
        type: number
      unit:
        type: string
    type: object
  domain.FeedingMixtureDetail:
    properties:
      amount:
        type: number
      feed_name:
        type: string
      id_detail:
        type: string
      id_feed:
        type: string
      id_feeding_mixture:
        type: string
    type: object
  domain.Genealogy:
    properties:
      father:
        $ref: '#/definitions/domain.Genealogy'
      gender:
        type: string
      id_sheep:
        type: string
      mother:
        $ref: '#/definitions/domain.Genealogy'
      sheep_code:
        type: string
      sheep_name:
        type: string
    type: object
  domain.MonthlyWeight:
    properties:
      month:
        type: string
      weight:
        type: number
    type: object
  domain.Parent:
    properties:
      id_sheep:
        type: string
      sheep_name:
        type: string
    type: object
  domain.RecommendationItem:
    properties:
      jumlah_kg:
        type: number
      kategori:
        type: string
      keterangan:
        type: string
    type: object
  domain.Sheep:
    properties:
      adg:
        type: integer
      adg_label:
        type: string
      age_days:
        type: integer
      age_months:
        type: number
      age_string:
        type: string
      created_at:
        type: string
      created_by:
        type: string
      date_of_birth:
        type: string
      father:
        $ref: '#/definitions/domain.Parent'
      gender:
        type: string
      id_cage:
        type: string
      id_father:
        type: string
      id_mother:
        type: string
      id_sheep:
        type: string
      id_type:
        type: string
      is_ready_to_mate:
        type: boolean
      last_weight:
        type: number
      mating_status:
        type: string
      mother:
        $ref: '#/definitions/domain.Parent'
      origin:
        type: string
      owner:
        type: string
      photo_url:
        type: string
      poel_level:
        type: string
      sheep_code:
        type: string
      sheep_name:
        type: string
      status:
        type: string
      type_name:
        type: string
      umur_method:
        type: string
      updated_at:
        type: string
      updated_by:
        type: string
    type: object
  domain.SilageConversion:
    properties:
      conversion_date:
        type: string
      created_at:
        type: string
      details:
        items:
          $ref: '#/definitions/domain.SilageConversionDetail'
        type: array
      id_conversion:
        type: string
      id_target_feed:
        type: string
      notes:
        type: string
      status:
        type: string
      target_amount:
        type: number
      target_feed_name:
        type: string
      unit:
        type: string
    type: object
  domain.SilageConversionDetail:
    properties:
      amount:
        type: number
      feed_name:
        type: string
      id_conversion:
        type: string
      id_detail:
        type: string
      id_feed:
        type: string
    type: object
  http.CreateFarmRequest:
    properties:
      code:
        maxLength: 45
        type: string
      description:
        type: string
      location:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        type: string
    required:
    - code
    - name
    type: object
  http.ExternalDonorRequest:
    properties:
      name:
        type: string
      origin:
        type: string
    type: object
  http.UpdateFarmRequest:
    properties:
      code:
        maxLength: 45
        type: string
      description:
        type: string
      location:
        maxLength: 255
        type: string
      name:
        maxLength: 255
        type: string
    required:
    - code
    - name
    type: object
  responses.Error:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  responses.Meta:
    properties:
      page:
        type: integer
      size:
        type: integer
      total:
        type: integer
      total_pages:
        type: integer
    type: object
  responses.Response-any:
    properties:
      data: {}
      error:
        $ref: '#/definitions/responses.Error'
      message:
        type: string
      meta:
        $ref: '#/definitions/responses.Meta'
      success:
        type: boolean
    type: object
  responses.Response-array_domain_Farm:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Farm'
        type: array
      error:
        $ref: '#/definitions/responses.Error'
      message:
        type: string
      meta:
        $ref: '#/definitions/responses.Meta'
      success:
        type: boolean
    type: object
  responses.Response-domain_Farm:
    properties:
      data:
        $ref: '#/definitions/domain.Farm'
      error:
        $ref: '#/definitions/responses.Error'
      message:
        type: string
      meta:
        $ref: '#/definitions/responses.Meta'
      success:
        type: boolean
    type: object
host: localhost:8080
info:
  contact:
    email: support@farmease.id
    name: API Support
  description: API Documentation for Farmease Backend Service
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: http://swagger.io/terms/
  title: Farmease API
  version: "1.0"
paths:
  /api/cages:
    get:
      consumes:
      - application/json
      description: Retrieve all cages with filtering by cage type
      parameters:
      - description: Filter by cage type
        in: query
        name: cage_type
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Cage'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Get list of all cages
      tags:
      - cages
    post:
      consumes:
      - application/json
      description: Create a new sheep cage with capacity and code
      parameters:
      - description: Cage details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Cage'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Cage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Create a new cage
      tags:
      - cages
  /api/cages/{id}:
    delete:
      consumes:
      - application/json
      description: Delete a cage by ID (fails if cage is not empty)
      parameters:
      - description: Cage ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "204":
          description: No Content
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Delete a cage
      tags:
      - cages
    get:
      consumes:
      - application/json
      description: Retrieve specific cage details by ID
      parameters:
      - description: Cage ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Cage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Get details of a cage
      tags:
      - cages
    put:
      consumes:
      - application/json
      description: Update details of an existing cage
      parameters:
      - description: Cage ID
        in: path
        name: id
        required: true
        type: integer
      - description: Cage details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Cage'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Cage'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Update a cage
      tags:
      - cages
  /api/cages/{id}/stats:
    get:
      consumes:
      - application/json
      description: Retrieve sheep statistics for a specific cage
      parameters:
      - description: Cage ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.CageStats'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Get stats of a cage
      tags:
      - cages
  /api/cages/{id}/weight-stats:
    get:
      consumes:
      - application/json
      description: Retrieve monthly aggregated weight statistics for a specific cage
      parameters:
      - description: Cage ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.CageWeightStats'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Get weight stats of a cage
      tags:
      - cages
  /api/cages/verify/{code}:
    get:
      consumes:
      - application/json
      description: Check if a cage code exists and get its details
      parameters:
      - description: Cage Code
        in: path
        name: code
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Cage'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Verify cage by code
      tags:
      - cages
  /api/feedings:
    get:
      consumes:
      - application/json
      description: Retrieve all feeding records across the system with filtering and
        pagination
      parameters:
      - description: Filter by sheep ID
        in: query
        name: id_sheep
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Feeding'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Get list of all feedings
      tags:
      - feeds
  /api/feeds:
    get:
      consumes:
      - application/json
      description: Retrieve all types of feed available in stock
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Feed'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Get list of master feeds
      tags:
      - feeds
    post:
      consumes:
      - application/json
      description: Register a new type of feed in master data
      parameters:
      - description: Feed details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Feed'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Feed'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Add new feed type
      tags:
      - feeds
  /api/feeds/{id}/stock:
    patch:
      consumes:
      - application/json
      description: Add or subtract feed stock
      parameters:
      - description: Feed ID
        in: path
        name: id
        required: true
        type: string
      - description: Stock update details
        in: body
        name: request
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Response-any'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Update feed stock
      tags:
      - feeds
  /api/feeds/conversions:
    get:
      consumes:
      - application/json
      description: Retrieve all recorded silage conversion logs
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.SilageConversion'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Get all silage conversions
      tags:
      - feeds
    post:
      consumes:
      - application/json
      description: Record a silage conversion event
      parameters:
      - description: Conversion details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.SilageConversion'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.SilageConversion'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Response-any'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Record silage conversion
      tags:
      - feeds
  /api/feeds/mixtures:
    post:
      consumes:
      - application/json
      description: Record a mixture feeding event
      parameters:
      - description: Mixture details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.FeedingMixture'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.FeedingMixture'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Response-any'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Record feeding mixture
      tags:
      - feeds
  /api/pakan/rekomendasi/kandang/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve total feed recommendation for all sheep in a specific
        cage
      parameters:
      - description: Cage ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.CageFeedRecommendation'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Get feed recommendation per cage
      tags:
      - feeds
  /api/sheep:
    get:
      consumes:
      - application/json
      description: Retrieve all sheep with filtering by cage, gender, and status
      parameters:
      - description: Filter by cage ID
        in: query
        name: id_cage
        type: integer
      - description: Filter by gender (Jantan/Betina)
        in: query
        name: gender
        type: string
      - description: Filter by status
        in: query
        name: status
        type: string
      - description: Search by tag or nickname
        in: query
        name: search
        type: string
      - description: Page number
        in: query
        name: page
        type: integer
      - description: Items per page
        in: query
        name: per_page
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Sheep'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Get list of all sheep
      tags:
      - sheep
    post:
      consumes:
      - application/json
      description: Create a new sheep entry with initial details
      parameters:
      - description: Sheep details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Sheep'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.Sheep'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Register a new sheep
      tags:
      - sheep
  /api/sheep/{id}:
    get:
      consumes:
      - application/json
      description: Retrieve specific sheep details by ID
      parameters:
      - description: Sheep ID
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Sheep'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Get details of a sheep
      tags:
      - sheep
    put:
      consumes:
      - application/json
      description: Update details of an existing sheep
      parameters:
      - description: Sheep ID
        in: path
        name: id
        required: true
        type: integer
      - description: Sheep details
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.Sheep'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Sheep'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/responses.Response-any'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Update sheep details
      tags:
      - sheep
  /api/sheep/{id}/feed-recommendation:
    get:
      consumes:
      - application/json
      description: Calculate recommended feed for a sheep based on its weight
      parameters:
      - description: Sheep ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.FeedRecommendation'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Get feed recommendation
      tags:
      - feeds
  /api/sheep/{id}/feedings:
    get:
      consumes:
      - application/json
      description: Retrieve feeding history for a specific sheep
      parameters:
      - description: Sheep ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.Feeding'
            type: array
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/responses.Response-any'
      security:
      - ApiKeyAuth: []
      summary: Get feeding history
      tags:
      - feeds
    post:
      consumes:
